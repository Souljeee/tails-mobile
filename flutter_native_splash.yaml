# Нативный splash «Хвостики» — вариант A + E (символ без подложки).
# Положить в корень Flutter-проекта рядом с pubspec.yaml, затем:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # iOS и Android до 12: фон + картинка по центру (картинка в плотности 4x)
  color: "#F6F2EC"
  image: assets/splash/splash.png
  color_dark: "#111518"
  image_dark: assets/splash/splash_dark.png

  # Android 12+: SplashScreen API, иконка без подложки (1152×1152, внутри круга 768 px)
  android_12:
    color: "#F6F2EC"
    image: assets/splash/android12.png
    color_dark: "#111518"
    image_dark: assets/splash/android12_dark.png

  ios_content_mode: center
  web: false
